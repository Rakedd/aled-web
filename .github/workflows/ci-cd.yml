name: CI/CD

on:
  push:
    branches: ['**']

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:tz
      - run: npm run build

  integration:
    name: Integration tests (local Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor
      - run: npm run test:integration
      - if: always()
        run: npx supabase stop --no-backup

  deploy:
    name: Deploy production (migrations, then Vercel)
    if: github.ref == 'refs/heads/main'
    needs: [checks, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_YES: 'true'
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Link the production Supabase project
        run: npx supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: List pending migrations
        run: npx supabase db push --dry-run
      - name: Apply pending migrations
        run: npx supabase db push
      - name: Pull Vercel production settings
        run: npx vercel@64.5.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build for Vercel
        run: npx vercel@64.5.0 build --prod --token="$VERCEL_TOKEN"
      - name: Deploy to Vercel production
        run: npx vercel@64.5.0 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
