<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Connexion</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&amp;family=Figtree:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F5C46}a:hover{color:#16231D}
</style>
</helmet>
<div style="min-height: 1000px; background: #F2F4F1; color: #16231D; font-family: 'Figtree', sans-serif; display: flex; flex-wrap: wrap">
  <section aria-label="Présentation" style="flex: 1 1 420px; background: #1F5C46; color: #FFFFFF; padding: 56px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; gap: 40px">
    <span style="font-family: 'Manrope', sans-serif; font-size: 28px; font-weight: 800">Freeclutch</span>
    <div style="display: flex; flex-direction: column; gap: 18px; max-width: 520px">
      <h1 style="margin: 0; font-family: 'Manrope', sans-serif; font-size: 56px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.02">Toutes tes missions freelance, au même endroit.</h1>
      <p style="margin: 0; font-size: 18px; line-height: 1.5; color: #E4F0E9">Candidatures, entretiens, briefs et nouvelles missions Free-Work, sans rien oublier.</p>
    </div>
    <div style="display: flex; gap: 10px; flex-wrap: wrap" aria-hidden="true">
      <span style="font-size: 14px; font-weight: 700; padding: 8px 14px; border-radius: 999px; background: #FFB48A; color: #16231D">Entretien mer. 10:00</span>
      <span style="font-size: 14px; font-weight: 700; padding: 8px 14px; border-radius: 999px; background: #DCD6F7; color: #16231D">Brief prêt</span>
      <span style="font-size: 14px; font-weight: 700; padding: 8px 14px; border-radius: 999px; background: #FFFFFF; color: #16231D">650 €/j</span>
    </div>
  </section>

  <main style="flex: 1 1 420px; display: flex; align-items: center; justify-content: center; padding: 48px 24px; box-sizing: border-box">
    <div style="width: 100%; max-width: 420px; background: #FFFFFF; border-radius: 32px; padding: 36px; display: flex; flex-direction: column; gap: 18px; box-shadow: 0 16px 40px rgba(22, 35, 29, 0.08)">
      <h2 style="margin: 0; font-family: 'Manrope', sans-serif; font-size: 30px; font-weight: 800; letter-spacing: -0.02em">Connexion</h2>
      <p style="margin: 0; font-size: 15px; color: #3B4A42">Reçois un lien de connexion par e-mail. Pas de mot de passe.</p>
      <div style="display: flex; flex-direction: column; gap: 6px"><label for="email-c" style="font-size: 14px; font-weight: 600">Adresse e-mail</label><input id="email-c" type="email" placeholder="toi@exemple.fr" style="font-family: 'Figtree', sans-serif; font-size: 16px; padding: 14px 16px; border-radius: 16px; border: 1px solid #C9D3CC; background: #F7F9F7"></div>
      <button type="button" style="font-family: 'Figtree', sans-serif; font-size: 16px; font-weight: 700; padding: 15px 22px; border-radius: 999px; border: 0; background: #1F5C46; color: #FFFFFF; cursor: pointer">Recevoir un lien de connexion</button>
      <span style="font-size: 13px; color: #55625B; text-align: center">Accès sur invitation uniquement.</span>
    </div>
  </main>
</div>
</x-dc>

</body>
</html>
